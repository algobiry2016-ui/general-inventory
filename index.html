<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المخزون — رصيد افتتاحي · وارد · منصرف</title>
<style>
:root{
  --ink:#0D2026; --teal:#0E6E63; --amber:#B4770F; --red:#A8291F;
  --bg:#F4F6F5; --card:#fff; --line:#DCE4E3; --line2:#EDF1F0; --txt:#12262C; --txt2:#5C7076;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Kufi Arabic","Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.topbar{background:var(--ink);color:#EAF2F1;padding:14px 16px 0}
.topbar h1{font-size:16px}
.topbar small{color:#8FAFAD;font-size:11.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#9DBAB8;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px}
.tab.on{background:var(--bg);color:var(--ink)}
main{padding:16px 14px 40px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(13,32,38,.06)}
.card+.card{margin-top:14px}
.card-h{padding:13px 15px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-h .sub{font-size:12px;color:var(--txt2)}
.card-b{padding:15px}
.pagehead{margin-bottom:14px}
.pagehead h2{font-size:19px}
.pagehead p{margin:2px 0 0;color:var(--txt2);font-size:12.5px}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.f{display:block}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{background:#FAFCFB}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#0B584F}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--txt2)}
.btn.ghost:hover{background:var(--line2);color:var(--txt)}
.btn.danger{color:var(--red);border-color:#E8CFCC}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th{background:#F7FAF9;font-size:11.5px;color:var(--txt2);font-weight:700}
td.num,th.num{font-variant-numeric:tabular-nums;font-weight:600}
td.wrap{white-space:normal;min-width:130px}
tfoot td{background:#F7FAF9;font-weight:800;border-top:2px solid var(--line)}
tbody tr:hover{background:#FAFCFB}
.tag{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700}
.ok{background:#E4F1EE;color:#0A5B52}.low{background:#FBF0DC;color:#8A5A08}.zero{background:#FBE7E5;color:var(--red)}
.empty{text-align:center;padding:32px 16px;color:var(--txt2)}
.empty strong{display:block;color:var(--txt);margin-bottom:5px}
.detail{background:#FBFCFC;font-size:12.5px;color:var(--txt2)}
.detail td{white-space:normal}
#toast{position:fixed;inset-inline:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:100px;font-size:13.5px;font-weight:600;max-width:90%}
.toast.bad{background:var(--red)}
#print-zone{display:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{width:100%;max-width:340px}
.gate h2{font-size:17px;margin-bottom:2px}
.gate p{color:var(--txt2);font-size:12.5px;margin:0 0 16px}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:1em}
.topbtns{position:absolute;inset-inline-end:14px;top:12px;display:flex;gap:6px}
.topbar{position:relative}
.icobtn{border:1px solid #23414A;background:#12303A;color:#EAF2F1;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600}
.icobtn:hover{background:#17414D}
.modal-bg{position:fixed;inset:0;background:rgba(13,32,38,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.modal .card-h{border-radius:12px 12px 0 0}
.who{font-size:12px;color:var(--txt2);background:var(--line2);padding:8px 10px;border-radius:8px;margin-bottom:12px}
.badge-branch{display:inline-block;background:#E4F1EE;color:#0A5B52;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;margin-inline-start:6px}
select.badge-branch{border:none;appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;padding-inline-end:20px;font-family:inherit}
/* التوريدات الواردة */
.rc{border-top:1px solid var(--line2);padding:12px 15px}
.rc.on{background:#FBFCFB;box-shadow:inset 3px 0 0 var(--teal)}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rc-name{font-weight:700;font-size:14.5px}
.rc-qty{display:inline-block;background:#E4F1EE;color:#0A5B52;padding:1px 9px;border-radius:100px;font-size:12.5px;margin-inline-start:4px}
.rc-meta{font-size:12px;color:var(--txt2);margin-top:2px}
.rc-b{margin-top:12px}
.rc-sec{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.rc-sec-h{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc-sum{padding:1px 9px;border-radius:100px;font-size:11.5px}
.rc-sum.ok{background:#E4F1EE;color:#0A5B52}.rc-sum.bad{background:#FBE7E5;color:var(--red)}
.rc-part{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.rc-part-n{flex:1;min-width:160px;font-weight:600}
.tab .cnt{display:inline-block;background:var(--amber);color:#fff;border-radius:100px;padding:0 7px;font-size:11px;margin-inline-start:5px}
/* التقارير */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;margin-bottom:12px;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer;font-weight:700;font-size:13px;color:var(--txt2)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.lead{font-size:14px;font-weight:600;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid #9DB0AE;border-radius:10px;padding:10px 13px}
.kpi span{display:block;font-size:11.5px;color:var(--txt2);font-weight:700}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi small{font-size:11px;color:var(--txt2)}
.kpi.k-in{border-top-color:var(--teal)}.kpi.k-out{border-top-color:#1F5FA8}.kpi.k-dmg{border-top-color:var(--red)}.kpi.k-warn{border-top-color:var(--amber)}
.t-in{background:#E4F1EE;color:#0A5B52}.t-out{background:#E3ECFB;color:#1B4F8C}.t-dmg{background:#FBE7E5;color:var(--red)}
.note{font-size:11.5px;color:var(--txt2)}
.bar{height:6px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#1F5FA8;border-radius:4px}
/* ورقة الطباعة */
#print-zone .pr{color:#111;font-size:10px;line-height:1.5}
#print-zone .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0D2026;padding-bottom:7px;margin-bottom:7px}
#print-zone .pr-brand{font-size:17px;font-weight:800;color:#0D2026}
#print-zone .pr-sys{font-size:10px;color:#5C7076}
#print-zone .pr-title{text-align:left}
#print-zone .pr-title h1{font-size:16px;margin:0;color:#0E6E63}
#print-zone .pr-title div{font-size:11.5px;font-weight:700}
#print-zone .pr-meta{display:flex;flex-wrap:wrap;gap:4px 18px;background:#F4F6F5;border:1px solid #DCE4E3;border-radius:6px;padding:6px 10px;margin-bottom:8px}
#print-zone .pr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
#print-zone .pr-kpis div{border:1px solid #DCE4E3;border-top:3px solid #0E6E63;border-radius:6px;padding:5px 8px}
#print-zone .pr-kpis span{display:block;font-size:9px;color:#5C7076;font-weight:700}
#print-zone .pr-kpis b{display:block;font-size:15px}
#print-zone .pr-kpis small{font-size:8.5px;color:#5C7076}
#print-zone h3{font-size:12px;margin:12px 0 5px;color:#0D2026;border-inline-start:4px solid #0E6E63;padding-inline-start:7px}
#print-zone table{width:100%;border-collapse:collapse;font-size:9.5px;page-break-inside:auto}
#print-zone tr{page-break-inside:avoid}
#print-zone th{background:#0D2026;color:#fff;font-weight:700;padding:4px 5px;border:1px solid #0D2026;text-align:right}
#print-zone td{border:1px solid #C9D3D1;padding:3px 5px;text-align:right;white-space:normal}
#print-zone tbody tr:nth-child(even) td{background:#F7FAF9}
#print-zone td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
#print-zone tfoot td{background:#E4F1EE;font-weight:800;border-top:2px solid #0D2026}
#print-zone .c-red{color:#A8291F;font-weight:700}#print-zone .c-amb{color:#8A5A08;font-weight:700}
#print-zone .c-grn{color:#0A5B52;font-weight:700}#print-zone .c-blu{color:#1B4F8C;font-weight:700}
#print-zone .pr-sign{display:flex;justify-content:space-between;gap:30px;margin-top:14px;page-break-inside:avoid;font-size:10.5px;line-height:2.2}
#print-zone .pr-lead{font-size:11.5px;font-weight:700;margin:4px 0 2px}
#print-zone .pr-empty{color:#5C7076;margin:0}
#print-zone .pr-foot{margin-top:10px;border-top:1px solid #DCE4E3;padding-top:4px;font-size:8.5px;color:#5C7076;text-align:center}
@media print{
  .app,#toast,#settings-modal{display:none!important}
  body{background:#fff}
  #print-zone{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:9mm}
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<div id="gate" class="gate" style="display:none">
  <div class="card">
    <div class="card-h"><h3>تسجيل الدخول</h3></div>
    <div class="card-b">
      <p style="color:var(--txt2);font-size:12.5px;margin:0 0 14px">نظام المخزون — دوكمنتيشن فلاورز</p>
      <div class="grid" style="gap:10px">
        <label class="f"><span>البريد الإلكتروني</span><input id="lg-email" type="email" autocomplete="username" placeholder="name@email.com"></label>
        <label class="f"><span>كلمة المرور</span><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      </div>
      <div class="btnrow" style="margin-top:14px"><button class="btn primary" id="lg-btn" style="width:100%">دخول</button></div>
      <div class="err" id="lg-err"></div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <header class="topbar">
    <h1>نظام المخزون <span id="branch-widget" style="vertical-align:middle"></span></h1>
    <div style="font-size:11px;color:#7E9E9B;letter-spacing:.5px;margin-top:1px">Documentation Flowers</div>
    <small id="sync-status">كميات فقط — بدون أي أسعار أو حسابات مالية</small>
    <div class="topbtns">
      <button class="icobtn" id="btn-settings">⚙️ الإعدادات</button>
      <button class="icobtn" id="btn-logout">خروج</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="settings-modal"></div>
<div id="print-zone"></div>
<div id="toast"></div>

<script>
const KEY='inventory-simple-v1';
const UNITS=['حبة','درزن','كرتون','كيلو','صندوق','علبة','باقة','متر','لتر','طقم'];
const BRANCHES=['الفرع الرئيسي','فرع الرياض'];
/* من يرى كل الفروع، ومين مقيّد بفرع معيّن — عدّل هالقائمة من كود الملف عند إضافة موظف جديد */
const ACCESS_MAP={
  'algobiry2016@gmail.com':{branch:'all'},
  'dm.flowers11@gmail.com':{branch:'all'},
  'ahmeddmflowers@gmail.com':{branch:'فرع الرياض'},
  'demployee93@gmail.com':{branch:'الفرع الرئيسي'}
};
const DEFAULT_BRANCH='الفرع الرئيسي'; // فرع الأصناف القديمة اللي ما لها فرع محدد — أي بريد غير مذكور أعلاه ما يدخل النظام
let RC=[], RMAP={};                   // التوريدات الواردة من المشتريات + ذاكرة ربط أصنافها
/* حسابات المشتريات فقط — ما تدخل نظام المخزون (حسابها موجود بس عشان إرسال التوريدات) */
const PURCHASE_ONLY=['ashrfmohamed787@gmail.com'];
let DB={items:[],moves:[]};           // items: {..., branch}; moves: {id,type:'in'|'out'|'damage',date,no,party,itemId,qty,notes,by}
let V='open', F={};
let noStore=false;
let CUR_EMAIL=null, CUR_BRANCH=null, CUR_ALL=false, VIEW=null;
const access=email=>ACCESS_MAP[(email||'').toLowerCase()]||null;
/* الأصناف/الحركات المرئية حسب الفرع المختار حاليًا للعرض (VIEW) */
const visItems=()=>VIEW==='all'?DB.items:DB.items.filter(i=>(i.branch||DEFAULT_BRANCH)===VIEW);
const activeItems=()=>visItems().filter(i=>!i.archived);
const visMoves=()=>{const ids=new Set(visItems().map(i=>i.id));return DB.moves.filter(m=>ids.has(m.itemId))};

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=Number(v);return isFinite(x)?x:0};
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:3});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dH=s=>{const p=(s||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'—'};
const ym=s=>(s||'').slice(0,7);
const M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mName=v=>{const[y,m]=(v||'').split('-');return m?`${M[+m-1]} ${y}`:'—'};
const it=id=>DB.items.find(i=>i.id===id);
/* تطبيع اسم الصنف: يوحّد المسافات الزايدة وفروقات الهمزة/التاء المربوطة/الألف المقصورة
   عشان "ورد احمر" و"ورد أحمر" يتعاملوا كنفس الصنف بفحص التكرار والبحث */
const normName=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const sameName=(a,b)=>normName(a)===normName(b);
const matchName=(name,q)=>normName(name).includes(normName(q));
const DEFAULT_CATS=['عطور','فازات','شوكلت','تغليف','أخرى'];
const allCats=()=>[...new Set([...DEFAULT_CATS,...DB.items.map(i=>i.category).filter(Boolean)])];
const allUnits=()=>[...new Set([...UNITS,...DB.items.map(i=>i.unit).filter(Boolean)])];
/* تصنيف تلقائي حسب بداية اسم الصنف — يُستخدم إذا ترك المستخدم خانة التصنيف فاضية */
const CAT_RULES=[
  {cat:'فازات', kws:['فازة','فازه']},
  {cat:'عطور', kws:['عطر']},
  {cat:'شوكلت', kws:['شوكلت','شوكولاته','شوكولاتة']},
  {cat:'تغليف', kws:['تغليف','تغاليف']},
];
const autoCategory=name=>{
  const nm=normName(name);
  for(const r of CAT_RULES){if(r.kws.some(k=>nm.startsWith(normName(k))))return r.cat;}
  return 'أخرى';
};
function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'');t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3000)}

/* Firebase — قاعدة بيانات مشتركة بين كل من يفتح هذا الملف من أي متصفح */
const firebaseConfig = {
  apiKey: "AIzaSyBWqYAsKVx0wOJTAahhQdLj20x9y37hHX0",
  authDomain: "r123466e.firebaseapp.com",
  databaseURL: "https://r123466e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "r123466e"
};
let fbRef=null;
try{ firebase.initializeApp(firebaseConfig); fbRef=firebase.database().ref(KEY); }catch(e){fbRef=null}

/* الحفظ صار لكل سجل (صنف/حركة) على حدة بدل استبدال القاعدة كلها —
   يمنع ضياع تعديل موظف إذا كتب موظف ثاني بنفس اللحظة تقريبًا على صنف/حركة مختلفة */
let tm;function saveLocalOnly(){clearTimeout(tm);tm=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){noStore=true}
},200)}
async function fbWrite(paths){
  if(!fbRef){saveLocalOnly();return}
  try{await fbRef.update(paths)}
  catch(e){noStore=true;toast('تعذّر الحفظ — تحقّق من الاتصال بالإنترنت.','bad')}
}
const saveItem=i=>fbWrite({[`items/${i.id}`]:i});
const saveItemFields=(id,fields)=>{const p={};Object.keys(fields).forEach(k=>p[`items/${id}/${k}`]=fields[k]);return fbWrite(p)};
const deleteItemRemote=id=>fbWrite({[`items/${id}`]:null});
const saveMove=m=>fbWrite({[`moves/${m.id}`]:m});
const deleteMoveRemote=id=>fbWrite({[`moves/${id}`]:null});
/* استبدال كامل (مستخدم فقط عند استيراد نسخة احتياطية يدويًا) */
async function fbReplaceAll(){
  if(!fbRef){saveLocalOnly();return}
  try{
    const itemsKeyed={};DB.items.forEach(i=>itemsKeyed[i.id]=i);
    const movesKeyed={};DB.moves.forEach(m=>movesKeyed[m.id]=m);
    await fbRef.child('items').set(itemsKeyed);
    await fbRef.child('moves').set(movesKeyed);
  }catch(e){noStore=true;toast('تعذّر الحفظ — تحقّق من الاتصال بالإنترنت.','bad')}
}

/* الرصيد الحالي = افتتاحي + وارد − منصرف */
function bal(id,upto){
  const i=it(id); if(!i) return 0;
  let b=n(i.opening);
  DB.moves.forEach(m=>{if(m.itemId!==id)return; if(upto&&m.date>upto)return;
    b+= m.type==='in'?n(m.qty):-n(m.qty)});
  return b;
}
/* لو الرصيد نزل تحت الصفر بأي يوم: كمية التسوية (أعمق سالب) وأول يوم صار فيه سالب.
   التسوية بتاريخ أول يوم سالب تخلّي الرصيد صفر أو أكثر بكل الأيام، فحتى تقارير الأشهر الماضية تنضبط */
function negInfo(id){
  const dates=[...new Set(DB.moves.filter(m=>m.itemId===id).map(m=>m.date).filter(Boolean))].sort();
  let min=0,first=null;
  dates.forEach(d=>{const b=bal(id,d);if(b<min)min=b;if(b<-1e-9&&!first)first=d});
  return first?{qty:R3(-min),date:first,now:bal(id)}:null;
}
const negItems=()=>visItems().map(i=>({i,x:negInfo(i.id)})).filter(r=>r.x);
/* أقل رصيد من تاريخ معيّن لين اليوم — يُستخدم للتحقق من عمليات الصرف بتاريخ قديم */
function minBalFrom(id,d){
  const dates=[...new Set(DB.moves.filter(m=>m.itemId===id&&m.date>d).map(m=>m.date))];
  return Math.min(bal(id,d),bal(id),...dates.map(x=>bal(id,x)));
}
const st=(b,min)=> n(b)<=0?{k:'zero',t:'نفد'} : (n(min)>0&&n(b)<=n(min)?{k:'low',t:'منخفض'}:{k:'ok',t:'متوفر'});

/* تنبيهات واتساب للأصناف اللي وصلت للحد الأدنى */
const BRANCH_WHATS={'الفرع الرئيسي':'966533228036','فرع الرياض':'966501027553'};
const WHATS_NUM='966533228036'; // احتياطي لو الفرع غير معروف
const waLink=(text,branch)=>`https://wa.me/${BRANCH_WHATS[branch]||WHATS_NUM}?text=${encodeURIComponent(text)}`;
const lowItems=()=>activeItems().map(i=>({i,b:bal(i.id)})).filter(x=>st(x.b,x.i.min).k!=='ok');
const lowMsg=(i,b)=>`⚠️ تنبيه مخزون\nالصنف: ${i.name}\nالمتبقي: ${fmt(b)} ${i.unit}\nالحد الأدنى: ${fmt(i.min)} ${i.unit}\nالحالة: ${st(b,i.min).t}`;
const allLowMsg=list=>`⚠️ تنبيه مخزون — أصناف منخفضة (${list.length})\n\n`+list.map(x=>`• ${x.i.name}: متبقي ${fmt(x.b)} ${x.i.unit} (الحد الأدنى ${fmt(x.i.min)})`).join('\n');

/* ---------- التنقل ---------- */
const TABS=[{id:'open',t:'الرصيد الافتتاحي'},{id:'rcv',t:'توريدات واردة'},{id:'in',t:'الوارد'},{id:'out',t:'المنصرف'},{id:'damage',t:'التالف'},{id:'rep',t:'التقارير'}];
function go(v){V=v;F={};render();scrollTo(0,0)}
function render(){
  const a=document.activeElement;
  const keepId=(a&&a.id&&a.tagName==='INPUT')?a.id:null;
  let sel=null;
  if(keepId){try{sel=[a.selectionStart,a.selectionEnd]}catch(e){sel=null}}
  const pc=pendingRc().length;
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${V===t.id?'on':''}" data-v="${t.id}">${t.t}${t.id==='rcv'&&pc?`<span class="cnt">${pc}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#view').innerHTML={open:vOpen,rcv:vRcv,in:vMove,out:vMove,damage:vMove,rep:vRep}[V]();
  bind();
  if(keepId){const el=document.getElementById(keepId);
    if(el){el.focus();if(sel){try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
}

/* ---------- 2+3+4) الوارد / المنصرف / التالف ---------- */
function vMove(){
  const CFG={
    in:{title:'الوارد',desc:'كل كمية تدخل المخزن تُضاف تلقائيًا إلى الرصيد.',party:'اسم المورد',btn:'إضافة إلى المخزون',check:false},
    out:{title:'المنصرف',desc:'كل كمية تخرج من المخزن تُخصم تلقائيًا من الرصيد.',party:'اسم العميل / الجهة',btn:'خصم من المخزون',check:true},
    damage:{title:'التالف / الهالك',desc:'سجّل الكميات التالفة أو المفقودة، سيتم خصمها تلقائيًا من المخزون.',party:'سبب التلف',btn:'تسجيل كتالف',check:true}
  }[V];

  let rows=visMoves().filter(m=>m.type===V);
  if(F.item)rows=rows.filter(m=>m.itemId===F.item);
  if(F.mcat)rows=rows.filter(m=>{const i2=it(m.itemId);return i2&&(i2.category||'')===F.mcat});
  if(F.from)rows=rows.filter(m=>m.date>=F.from);
  if(F.to)rows=rows.filter(m=>m.date<=F.to);
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const total=rows.reduce((a,m)=>a+n(m.qty),0);
  const PAGE_SIZE=50;
  const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  const page=Math.min(F.mpage||0,totalPages-1);
  const pageRows=rows.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);

  if(!visItems().length) return `<div class="card"><div class="empty"><strong>أضف الأصناف أولاً</strong>
    ابدأ من تبويب «الرصيد الافتتاحي».<br><button class="btn primary sm" style="margin-top:10px" data-a="goopen">الذهاب إلى الأصناف</button></div></div>`;

  // اختيار الصنف بالبحث عن جزء من الاسم بدل القائمة المنسدلة
  if(F.mid && (!it(F.mid) || it(F.mid).name!==F.mq)) delete F.mid;
  const q=(F.mq||'').trim();
  const matches=q?activeItems().filter(i=>matchName(i.name,q)).slice(0,10):[];
  const showList=q && !F.mid;
  const picked=F.mid?it(F.mid):null;

  return `
  <div class="pagehead"><h2>${CFG.title}</h2><p>${CFG.desc}</p></div>

  <div class="card">
    <div class="card-h"><h3>تسجيل ${CFG.title==='الوارد'?'وارد':(CFG.title==='المنصرف'?'صرف':'تالف')} جديد</h3></div>
    <div class="card-b">
      <div class="grid g2">
        <label class="f"><span>التاريخ</span><input id="m-date" data-f="mdate" data-live="1" type="date" value="${esc(F.mdate||today())}"></label>
        <label class="f"><span>رقم الفاتورة / العملية</span><input id="m-no" data-f="mno" data-live="1" placeholder="اختياري" value="${esc(F.mno||'')}"></label>
        <label class="f"><span>${CFG.party}</span><input id="m-party" data-f="mparty" data-live="1" placeholder="اختياري" value="${esc(F.mparty||'')}"></label>
        <label class="f"><span>الصنف *</span>
          <input id="mq" data-f="mq" data-live="1" autocomplete="off" value="${esc(F.mq||'')}" placeholder="اكتب جزءًا من اسم الصنف... مثال: فازه">
          ${picked?`<div style="font-size:11.5px;color:var(--txt2);margin-top:4px">✓ ${esc(picked.name)} — المتاح حاليًا ${fmt(bal(picked.id))} ${esc(picked.unit)}${VIEW==='all'?` <span class="badge-branch">${esc(picked.branch||DEFAULT_BRANCH)}</span>`:''}</div>`:''}
        </label>
        <label class="f"><span>الكمية *</span><input id="m-qty" data-f="mqty" type="number" step="any" min="0" placeholder="0" value="${esc(F.mqty||'')}"></label>
        <label class="f"><span>ملاحظات</span><input id="m-notes" data-f="mnotes" data-live="1" placeholder="اختياري" value="${esc(F.mnotes||'')}"></label>
      </div>
      ${showList?`<div style="margin-top:10px">
        ${matches.length?`<div class="btnrow">${matches.map(i=>`<button type="button" class="btn sm" data-a="pickitem" data-id="${i.id}">${esc(i.name)} <span style="color:var(--txt2)">(متاح ${fmt(bal(i.id))} ${esc(i.unit)})</span>${VIEW==='all'?` <span class="badge-branch">${esc(i.branch||DEFAULT_BRANCH)}</span>`:''}</button>`).join('')}</div>`
        :`<div style="font-size:12.5px;color:var(--txt2)">لا يوجد صنف مطابق لـ «${esc(q)}»</div>`}
      </div>`:''}
      <div class="btnrow" style="margin-top:12px">
        <button class="btn primary" data-a="addmove" data-type="${V}">${CFG.btn}</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h3>السجل</h3><span class="sub">${rows.length} عملية — إجمالي ${fmt(total)}</span></div>
    <div class="card-b" style="border-bottom:1px solid var(--line2)">
      <div class="grid g2">
        <label class="f"><span>الصنف</span><select data-f="item"><option value="">الكل</option>
          ${visItems().map(i=>`<option value="${i.id}" ${F.item===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></label>
        <label class="f"><span>التصنيف</span><select data-f="mcat"><option value="">الكل</option>
          ${allCats().map(c=>`<option value="${esc(c)}" ${F.mcat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="f"><span>من تاريخ</span><input type="date" data-f="from" value="${esc(F.from||'')}"></label>
        <label class="f"><span>إلى تاريخ</span><input type="date" data-f="to" value="${esc(F.to||'')}"></label>
      </div>
    </div>
    <div class="tblwrap">
    ${rows.length?`<table><thead><tr><th>التاريخ</th><th>رقم العملية</th><th>${CFG.party}</th>
      <th>الصنف</th><th>التصنيف</th><th class="num">الكمية</th><th>الوحدة</th><th>ملاحظات</th><th>أضافها</th><th></th></tr></thead>
      <tbody>${pageRows.map(m=>{const i=it(m.itemId)||{};return `<tr>
        <td>${dH(m.date)}</td><td>${esc(m.no)||'—'}</td><td class="wrap">${esc(m.party)||'—'}</td>
        <td class="wrap"><b>${esc(i.name)}</b></td><td style="color:var(--txt2)">${esc(i.category)||'—'}</td><td class="num">${fmt(m.qty)}</td><td>${esc(i.unit)}</td>

        <td style="font-size:11.5px;color:var(--txt2)">${esc(m.by)||'—'}</td>
        <td>${CUR_ALL?`<button class="btn ghost sm" data-a="delmove" data-id="${m.id}">حذف</button>`:''}</td></tr>`}).join('')}</tbody>
      <tfoot><tr><td colspan="5">الإجمالي (كل النتائج)</td><td class="num">${fmt(total)}</td><td colspan="4"></td></tr></tfoot></table>`
    :`<div class="empty"><strong>لا توجد عمليات</strong>سجّل أول عملية من النموذج بالأعلى.</div>`}
    </div>

      <button class="btn sm" data-a="mprev" ${page<=0?'disabled':''}>‹ السابق</button>
      <span style="font-size:12px;color:var(--txt2)">صفحة ${page+1} من ${totalPages}</span>
      <button class="btn sm" data-a="mnext" ${page>=totalPages-1?'disabled':''}>التالي ›</button>
    </div>`:''}
  </div>`;
}

/* ---------- 5) التقارير (يومي / شهري / فترة محددة) ---------- */
/* تقرير واحد مختصر: أرقام سريعة، الأكثر صرفًا، حسب التصنيف، وأصناف تحتاج طلب.
   تفاصيل كل الأصناف مخفية ورا زر، وموجودة كاملة في الإكسل */
const TOP_N=10;
/* حساب اليوم السابق بالـ UTC — الحساب بالتوقيت المحلي كان يرجّع يومين ورا في السعودية */
const dayBefore=d=>{const dt=new Date(d+'T00:00:00Z');dt.setUTCDate(dt.getUTCDate()-1);return dt.toISOString().slice(0,10)};
const monthEnd=v=>{const[y,m]=v.split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)+1;
const branchOf=i=>(i&&i.branch)||DEFAULT_BRANCH;
/* الكميات تُجمع لكل وحدة على حدة ("26 حبة + 85 متر") بدل جمع حبة مع متر */
const unitAdd=(g,u,v)=>{if(n(v)){u=u||'—';g[u]=(g[u]||0)+n(v)}return g};
const unitTxt=g=>Object.entries(g).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]).map(([u,v])=>`${fmt(v)} ${u}`).join(' + ')||'—';
const coverTxt=c=>c==null?'—':c<1?'أقل من يوم':c>=365?'أكثر من سنة':`${Math.floor(c)} يوم`;

function repPeriod(){
  const mode=F.pmode||'month';
  let P;
  if(mode==='day'){const d=F.day||today();P={mode,from:d,to:d,label:`يوم ${dH(d)}`}}
  else if(mode==='range'){
    let from=F.pfrom||ym(today())+'-01', to=F.pto||today();
    if(from>to)[from,to]=[to,from];
    P={mode,from,to,label:`من ${dH(from)} إلى ${dH(to)}`};
  }else{const cur=F.ym||ym(today());P={mode:'month',ym:cur,from:cur+'-01',to:monthEnd(cur),label:`شهر ${mName(cur)}`}}
  P.days=Math.max(1,daysBetween(P.from,P.to<today()?P.to:today()));  // للمتوسط اليومي: الأيام اللي مرّت فعلًا
  return P;
}

function repCompute(){
  const P=repPeriod(), cat=F.rcat||'';
  const items=visItems().filter(i=>!cat||(i.category||'')===cat);
  const ids=new Set(items.map(i=>i.id)), byItem={};
  DB.moves.forEach(m=>{if(ids.has(m.itemId)&&m.date>=P.from&&m.date<=P.to)(byItem[m.itemId]=byItem[m.itemId]||[]).push(m)});
  const sum=(mv,t)=>mv.reduce((a,m)=>a+(m.type===t?n(m.qty):0),0);
  const cnt=(mv,t)=>mv.filter(m=>m.type===t).length;
  const prev=dayBefore(P.from);
  const rows=items.filter(i=>byItem[i.id]).map(i=>{
    const mv=byItem[i.id], inQ=sum(mv,'in'), outQ=sum(mv,'out'), dmQ=sum(mv,'damage');
    const open=Math.max(0,bal(i.id,prev)), now=Math.max(0,bal(i.id)), avg=outQ/P.days;
    return {i,inQ,outQ,dmQ,open,close:Math.max(0,open+inQ-outQ-dmQ),now,outN:cnt(mv,'out'),
      cover:avg>0?now/avg:null};
  }).sort((a,b)=>b.outN-a.outN||b.outQ-a.outQ||a.i.name.localeCompare(b.i.name,'ar'));
  const add=f=>rows.reduce((a,r)=>a+f(r),0);
  const allMv=rows.flatMap(r=>byItem[r.i.id]);
  const tot={outN:cnt(allMv,'out'),inN:cnt(allMv,'in'),dmN:cnt(allMv,'damage'),
    outItems:rows.filter(r=>r.outQ>0).length,inItems:rows.filter(r=>r.inQ>0).length,dmItems:rows.filter(r=>r.dmQ>0).length};
  /* الأكثر صرفًا: بعدد مرات الصرف (يقارن الأصناف بعدل مهما اختلفت وحداتها) */
  const top=rows.filter(r=>r.outQ>0).slice(0,TOP_N);
  const cats={};
  rows.forEach(r=>{const c=r.i.category||'بدون تصنيف';
    const x=cats[c]=cats[c]||{cat:c,items:0,outN:0,outU:{},dmU:{}};
    if(r.outQ>0)x.items++;x.outN+=r.outN;unitAdd(x.outU,r.i.unit,r.outQ);unitAdd(x.dmU,r.i.unit,r.dmQ)});
  const catRows=Object.values(cats).filter(c=>c.outN||Object.keys(c.dmU).length).sort((a,b)=>b.outN-a.outN||a.cat.localeCompare(b.cat,'ar'));
  /* تحتاج طلب = الوضع الحالي (مو الفترة): منخفض أو نفد */
  const need=activeItems().filter(i=>!cat||(i.category||'')===cat).map(i=>({i,b:bal(i.id)}))
    .filter(x=>st(x.b,x.i.min).k!=='ok').sort((a,b)=>a.b-b.b||a.i.name.localeCompare(b.i.name,'ar'));
  return {P,cat,rows,top,catRows,need,tot,branchLabel:VIEW==='all'?'كل الفروع':VIEW};
}

/* جملة تلخّص الفترة بالعربي البسيط */
const repSentence=R=>{const t=R.tot;
  if(!R.rows.length)return `ما فيه أي حركة خلال ${R.P.label}.`;
  return `خلال ${R.P.label}: انصرف ${t.outItems} صنف في ${t.outN} عملية، ووصل وارد لـ ${t.inItems} صنف`+(t.dmN?`، وتلف ${t.dmItems} صنف`:'')+'.'};

/* أقسام التقرير — نفسها للشاشة والطباعة والإكسل. الأرقام تبقى أرقام عشان الإكسل يجمعها */
function repSections(R,full){
  const all=VIEW==='all', br=i=>all?[branchOf(i)]:[], B=all?['الفرع']:[];
  const S=[
    {key:'top',title:`الأكثر صرفًا (أعلى ${TOP_N})`,empty:'ما فيه صرف بهالفترة.',
     head:['#','الصنف',...B,'مرات الصرف','الكمية المنصرفة','الرصيد الحالي','يكفي تقريبًا'],
     body:R.top.map((r,k)=>[k+1,r.i.name,...br(r.i),r.outN,`${fmt(r.outQ)} ${r.i.unit}`,`${fmt(r.now)} ${r.i.unit}`,coverTxt(r.cover)])},
    {key:'cat',title:'حسب التصنيف',empty:'ما فيه صرف بهالفترة.',
     head:['التصنيف','أصناف انصرفت','مرات الصرف','المنصرف','التالف'],
     body:R.catRows.map(c=>[c.cat,c.items,c.outN,unitTxt(c.outU),unitTxt(c.dmU)])},
    {key:'need',title:'أصناف تحتاج طلب (الوضع الحالي)',empty:'كل الأصناف متوفرة.',
     head:['الصنف',...B,'الرصيد الحالي','الحد الأدنى','الحالة'],
     body:R.need.map(x=>[x.i.name,...br(x.i),`${fmt(Math.max(0,x.b))} ${x.i.unit}`,n(x.i.min)?`${fmt(x.i.min)} ${x.i.unit}`:'—',st(x.b,x.i.min).t])}];
  if(full)S.push({key:'all',title:'تفاصيل كل الأصناف اللي تحرّكت',empty:'ما فيه حركة.',
     head:['الصنف','التصنيف',...B,'الوحدة','أول المدة','الوارد','المنصرف','التالف','آخر المدة'],
     body:R.rows.map(r=>[r.i.name,r.i.category||'—',...br(r.i),r.i.unit,r.open,r.inQ,r.outQ,r.dmQ,r.close])});
  return S;
}
const repKpis=R=>[
  {l:'عمليات الصرف',v:R.tot.outN,s:`${R.tot.outItems} صنف`,c:'k-out'},
  {l:'عمليات الوارد',v:R.tot.inN,s:`${R.tot.inItems} صنف`,c:'k-in'},

      <label class="f"><span>التصنيف</span><select data-f="rcat"><option value="">كل التصنيفات</option>
        ${allCats().map(c=>`<option value="${esc(c)}" ${F.rcat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    </div>
    <div class="btnrow" style="margin-top:12px">

function dl(blob,name){

/* ---------- التوريدات الواردة من نظام المشتريات ---------- */
/* كل صنف مخزني ينحفظ بفاتورة مشتريات يوصل هنا "بانتظار التأكيد".
   المسؤول يعدّ البضاعة، يربطها بصنف (أو أكثر للألوان)، ويأكد — فتنضاف حركة وارد. */
function hashStr(s){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36);
}
const R3=x=>Math.round(n(x)*1000)/1000;
const rcById=id=>RC.find(r=>r.id===id);
const visRc=()=>RC.filter(r=>r&&r.id&&(VIEW==='all'||r.branch===VIEW));

const rcMapKey=r=>'m'+hashStr(normName(r.name)+'|'+normName(r.unit)+'|'+(r.branch||''));
const rcBranchItems=r=>DB.items.filter(i=>!i.archived&&(i.branch||DEFAULT_BRANCH)===(r.branch||DEFAULT_BRANCH));
const fmtTime=t=>t?new Date(t).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{dateStyle:'short',timeStyle:'short'}):'—';

/* القاعدة: الصنف يدخل المخزون بنفس اسمه بالمشتريات. الاستثناء الوحيد: التوزيع على ألوان/أقسام (صنفين أو أكثر) */

function rcOpen(r){
  F.rid=r.id; F.rq=String(n(r.qty)); F.rnote=''; F.rsq='';

}

        <td style="font-size:11.5px;color:var(--txt2)">${esc(r.confirmedBy||r.rejectedBy||'')||'—'}</td>
        <td class="wrap" style="font-size:12.5px;color:var(--txt2)">${esc(r.note||r.cancelReason||'')||'—'}${CUR_ALL&&r.invoiceChanged?`<div style="color:var(--red);font-weight:700;margin-top:3px">⚠ ${esc(r.invoiceChanged)}</div>`:''}</td>
        ${CUR_ALL?`<td><button class="btn ghost sm" data-a="rchide" data-id="${r.id}">حذف من السجل</button></td>`:''}
      </tr>`).join('')}</tbody></table>`
    :`<div class="empty"><strong>لا يوجد سجل بعد</strong>التوريدات المؤكدة والمرفوضة تظهر هنا.</div>`}
    </div>
  </div>`;
}

function rcRow(r){
  const open=F.rid===r.id;
  return `<div class="rc${open?' on':''}">
    <div class="rc-h">
      <div>
        <div class="rc-name">${esc(r.name)} <span class="rc-qty">${fmt(r.qty)} ${esc(r.unit)}</span>${VIEW==='all'?` <span class="badge-branch">${esc(r.branch)}</span>`:''}</div>
        <div class="rc-meta">فاتورة ${esc(r.invoiceNo)||'—'} · ${esc(r.supplier)||'—'} · ${dH(r.invoiceDate)} · أدخلها ${esc(r.createdBy)||'—'}</div>
      </div>

    </div>
    ${open?rcForm(r):''}
  </div>`;
}

function rcForm(r){
  const parts=F.rparts||[];
  const many=parts.length>1;
  const rq=n(F.rq), rf=n(F.rf)||0, tot=R3(rq*rf);
  const sum=R3(parts.reduce((s,p)=>s+n(p.qty),0));
  const chosen=new Set(parts.map(p=>p.itemId));
  const q=(F.rsq||'').trim();
  const pool=rcBranchItems(r).filter(i=>!chosen.has(i.id));
  const matches=q?pool.filter(i=>matchName(i.name,q)).slice(0,10):[];
  const exact=q&&rcBranchItems(r).some(i=>sameName(i.name,q));
  const split=F.rmode==='split';
  const sameIt=rcSameItem(r);
  const newUnit=n(F.rf)===1?(r.unit||'حبة'):'حبة';
  const firstUnit=split?(parts.length&&it(parts[0].itemId)?it(parts[0].itemId).unit:''):(sameIt?sameIt.unit:newUnit);
  const diffQty=Math.abs(rq-n(r.qty))>1e-9;
  return `<div class="rc-b">
    <div class="grid g2">
      <label class="f"><span>الكمية المستلمة فعليًا (${esc(r.unit)})</span><input id="rc-q" data-rc="rq" type="number" step="any" min="0" value="${esc(F.rq)}"></label>
      <label class="f"><span>كل 1 ${esc(r.unit)} = كم ${esc(firstUnit||'حبة')} بالمخزون؟</span><input id="rc-f" data-rc="rf" type="number" step="any" min="0" value="${esc(F.rf)}"></label>
      <label class="f" style="grid-column:1/-1"><span>ملاحظة${diffQty?' <b style="color:var(--red)">(مطلوبة — المستلم يختلف عن الفاتورة)</b>':''}</span><input id="rc-n" data-rc="rnote" placeholder="مثال: وصل ناقص كرتون" value="${esc(F.rnote||'')}"></label>
    </div>
    ${!split?`<div class="rc-sec">
      <div class="rc-sec-h">يدخل المخزون باسم</div>
      <div class="rc-part">
        <span class="rc-part-n">${esc(r.name)} ${sameIt?`<span style="color:var(--txt2);font-size:12px">— الرصيد ${fmt(bal(sameIt.id))} ${esc(sameIt.unit)}</span>`:`<span class="tag low">صنف جديد — بينضاف للمخزون بالوحدة: ${esc(newUnit)}</span>`}</span>
        <b class="num">+${fmt(tot)} ${esc(sameIt?sameIt.unit:newUnit)}</b>
      </div>
      <button class="btn sm" data-a="rcsplit" style="margin-top:8px">توزيع على ألوان / أقسام</button>
    </div>`:`<div class="rc-sec">
      <div class="rc-sec-h">توزيع على ألوان / أقسام <button class="btn ghost sm" data-a="rcsame">رجوع لنفس الصنف</button> ${many?`<span class="rc-sum ${Math.abs(sum-tot)<1e-6?'ok':'bad'}">موزّع ${fmt(sum)} من ${fmt(tot)}</span>`:''}</div>
      ${parts.length?parts.map((p,k)=>{const i=it(p.itemId)||{name:'(صنف محذوف)',unit:''};return `<div class="rc-part">
        <span class="rc-part-n">${esc(i.name)} <span style="color:var(--txt2);font-size:12px">— الرصيد ${fmt(bal(p.itemId))} ${esc(i.unit)}</span></span>
        ${many?`<input id="rc-p-${k}" data-rp="${k}" type="number" step="any" min="0" placeholder="الكمية" value="${esc(p.qty)}" style="width:110px">`:`<b class="num">${fmt(tot)} ${esc(i.unit)}</b>`}
        <button class="btn ghost sm" data-a="rcrm" data-k="${k}">إزالة</button>
      </div>`}).join(''):`<div style="font-size:12.5px;color:var(--txt2);margin-bottom:6px">أضف اللون أو القسم (واحد أو أكثر)، ولو أكثر من واحد وزّع الكمية عليهم.</div>`}
      <input id="rc-s" data-rc="rsq" autocomplete="off" placeholder="${parts.length?'أضف لون أو قسم ثاني…':'مثال: '+esc(r.name)+' أحمر'}" value="${esc(F.rsq||'')}" style="margin-top:6px">
      ${q?`<div class="btnrow" style="margin-top:8px">
        ${matches.map(i=>`<button class="btn sm" data-a="rcadd" data-id="${i.id}">${esc(i.name)} <span style="color:var(--txt2)">(${fmt(bal(i.id))} ${esc(i.unit)})</span></button>`).join('')}
        ${!exact?`<button class="btn sm" data-a="rcnew" style="border-style:dashed">+ إضافة «${esc(q)}» كصنف جديد</button>`:''}
      </div>`:''}
    </div>`}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn primary" data-a="rcok">تأكيد الاستلام</button>
      <button class="btn danger" data-a="rcno">رفض / ما وصل</button>
      <button class="btn ghost" data-a="rcclose">إغلاق</button>
    </div>
  </div>`;
}

async function rcConfirm(){
  const r=rcById(F.rid);
  if(!r||r.status!=='pending')return toast('هذا التوريد ما عاد معلّق — يمكن أحد أكّده.','bad');
  const rq=n(F.rq), rf=n(F.rf), parts=(F.rparts||[]).slice(), note=(F.rnote||'').trim();
  if(rq<=0)return toast('الكمية المستلمة لازم أكبر من صفر — لو ما وصل شي استخدم «رفض».','bad');
  if(rf<=0)return toast('أدخل معامل تحويل الوحدة (1 لو نفس الوحدة).','bad');
  const split=F.rmode==='split';
  if(split&&!parts.length)return toast('أضف صنف واحد على الأقل (مثلًا اللون).','bad');
  if(Math.abs(rq-n(r.qty))>1e-9&&!note)return toast('المستلم يختلف عن الفاتورة — اكتب ملاحظة بالسبب.','bad');
  for(const p of parts){const i=it(p.itemId);if(!i||i.archived)return toast('فيه صنف محذوف أو مؤرشف بالقائمة — أزله.','bad');}
  const tot=R3(rq*rf);
  const upd={};
  let qtys, createdId=null;
  if(!split){
    let si=rcSameItem(r);
    if(!si){  // الصنف مو موجود بالمخزون: ينضاف بنفس اسمه بالمشتريات (ضمن نفس عملية التأكيد)
      si={id:uid(),name:String(r.name).trim(),category:autoCategory(r.name),unit:rf===1?(r.unit||'حبة'):'حبة',opening:0,min:0,branch:r.branch||DEFAULT_BRANCH};
      upd[`items/${si.id}`]=si;
      DB.items.push(si);createdId=si.id;
    }
    parts.length=0;parts.push({itemId:si.id});
    qtys=[tot];
  }else{
    if(parts.length===1){qtys=[tot];}else{qtys=parts.map(p=>R3(p.qty));
    if(qtys.some(x=>x<=0))return toast('عبّي كمية كل صنف بالتوزيع (أكبر من صفر) أو أزله.','bad');
    const sum=R3(qtys.reduce((s,x)=>s+x,0));
    if(Math.abs(sum-tot)>1e-6)return toast(`مجموع التوزيع ${fmt(sum)} لازم يساوي ${fmt(tot)}.`,'bad');}
  }
  const now=Date.now();
  const partsDoc=parts.map((p,k)=>({itemId:p.itemId,name:it(p.itemId).name,qty:qtys[k]}));
  partsDoc.forEach((p,k)=>{
    const mid=r.id+'_'+k;
    upd[`moves/${mid}`]={id:mid,type:'in',date:today(),no:String(r.invoiceNo||''),party:String(r.supplier||''),itemId:p.itemId,qty:p.qty,
      notes:'توريد من المشتريات'+(r.invoiceDate?` (فاتورة ${dH(r.invoiceDate)})`:'')+(note?' — '+note:''),by:CUR_EMAIL||'',receiptId:r.id};
  });
  upd[`receipts/${r.id}/status`]='confirmed';
  upd[`receipts/${r.id}/confirmedBy`]=CUR_EMAIL||'';
  upd[`receipts/${r.id}/confirmedAt`]=now;
  upd[`receipts/${r.id}/receivedQty`]=rq;
  upd[`receipts/${r.id}/factor`]=rf;
  upd[`receipts/${r.id}/parts`]=partsDoc;
  upd[`receipts/${r.id}/note`]=note;
  upd[`receiptMaps/${rcMapKey(r)}`]={mode:split?'split':'same',itemIds:parts.map(p=>p.itemId),factor:rf,by:CUR_EMAIL||'',at:now};
  // نطبّقها محليًا أول عشان ما يطلع تنبيه "تعديل من مستخدم آخر" على عملية المستخدم نفسه
  const localMoves=Object.keys(upd).filter(k=>k.startsWith('moves/')).map(k=>upd[k]);
  DB.moves.push(...localMoves);
  try{
    await fbRef.update(upd);   // كل شي بعملية وحدة: يا يدخل كله يا ما يدخل شي
  }catch(e){
    const ids=new Set(localMoves.map(m=>m.id));DB.moves=DB.moves.filter(m=>!ids.has(m.id));
    if(createdId)DB.items=DB.items.filter(i=>i.id!==createdId);
    const denied=String(e&&e.code||e&&e.message||'').toLowerCase().includes('permission');
    return toast(denied?'تعذّر التأكيد — غالبًا انأكد من شخص ثاني. حدّث الصفحة.':'تعذّر التأكيد — تحقّق من الإنترنت.','bad');
  }
  RC_KEYS.forEach(k=>delete F[k]);
  render();
  toast(`تم الاستلام: ${partsDoc.map(p=>`${p.name} +${fmt(p.qty)}`).join('، ')}`);
}

async function rcReject(){
  const r=rcById(F.rid);
  if(!r||r.status!=='pending')return toast('هذا التوريد ما عاد معلّق.','bad');
  const note=(F.rnote||'').trim();
  if(!note)return toast('اكتب سبب الرفض بخانة الملاحظة.','bad');
  if(!confirm(`رفض توريد «${r.name}»؟ ما راح يدخل المخزون، ويظهر مرفوض عند المشتريات.`))return;
  const upd={};
  upd[`receipts/${r.id}/status`]='rejected';
  upd[`receipts/${r.id}/rejectedBy`]=CUR_EMAIL||'';
  upd[`receipts/${r.id}/rejectedAt`]=Date.now();
  upd[`receipts/${r.id}/note`]=note;
  try{await fbRef.update(upd)}catch(e){return toast('تعذّر الرفض — حدّث الصفحة وحاول مرة ثانية.','bad')}
  RC_KEYS.forEach(k=>delete F[k]);
  render();toast('تم رفض التوريد.');
}

function rcNewItem(){
  const r=rcById(F.rid);if(!r)return;
  const nm=(F.rsq||'').trim();if(!nm)return;
  const br=r.branch||DEFAULT_BRANCH;
  if(DB.items.some(i=>sameName(i.name,nm)&&(i.branch||DEFAULT_BRANCH)===br&&!i.archived))return toast('هذا الصنف موجود — اختره من النتائج.','bad');
  const unit=n(F.rf)===1?(r.unit||'حبة'):'حبة';
  const newItem={id:uid(),name:nm,category:autoCategory(nm),unit,opening:0,min:0,branch:br};
  DB.items.push(newItem);saveItem(newItem);
  F.rparts=(F.rparts||[]).concat([{itemId:newItem.id,qty:''}]);F.rsq='';
  render();toast(`انضاف «${nm}» للمخزون (الوحدة: ${unit}) — عدّل التصنيف من الأصناف لو تبي.`);
}

/* ---------- الأحداث ---------- */
function bind(){
  const R=$('#view');
  const anEl=$('#a-name'),acEl=$('#a-cat'),ahEl=$('#a-cat-hint');
  if(anEl&&acEl&&ahEl){
    anEl.addEventListener('input',()=>{
      if(acEl.value.trim())return;
      const nm=anEl.value.trim();
      ahEl.textContent=nm?`سيُصنَّف تلقائيًا كـ: ${autoCategory(nm)}`:'اتركه فاضي ليصنَّف تلقائيًا حسب اسم الصنف';
    });
  }
  R.querySelectorAll('[data-f]').forEach(el=>{
    const evt=el.dataset.live?'input':'change';
    el.addEventListener(evt,()=>{F[el.dataset.f]=el.value;delete F.open;delete F.mpage;render()});
  });
  R.querySelectorAll('[data-rc]').forEach(el=>{
    el.addEventListener('input',()=>{F[el.dataset.rc]=el.value;render()});
  });
  R.querySelectorAll('[data-rp]').forEach(el=>{
    el.addEventListener('input',()=>{const p=(F.rparts||[])[+el.dataset.rp];if(p){p.qty=el.value;render()}});
  });
  R.querySelectorAll('[data-a]').forEach(el=>{
    const a=el.dataset.a;
    if(a==='restore'){el.onchange=e=>restore(e.target.files[0]);return}
    el.onclick=()=>{
      switch(a){
        case 'goopen':go('open');break;
        case 'gorcv':go('rcv');break;
        case 'fixneg':{  // تسوية جرد للأصناف اللي نزل رصيدها تحت الصفر — للإدارة فقط
          if(!CUR_ALL)break;
          const list=negItems();if(!list.length)break;
          const why=prompt(`تسوية ${list.length} صنف: بتنضاف حركة وارد «تسوية جرد» لكل صنف بتاريخ أول يوم صار فيه الخلل.\n\nاكتب السبب (مثال: فواتير انحذفت من المشتريات بعد الصرف):`);
          if(why===null)return;if(!why.trim())return toast('اكتب سبب التسوية.','bad');
          const upd={};
          list.forEach(r=>{const mv={id:uid(),type:'in',date:r.x.date,no:'تسوية',party:'تسوية جرد',itemId:r.i.id,qty:r.x.qty,notes:'تسوية رصيد — '+why.trim(),by:CUR_EMAIL||''};
            DB.moves.push(mv);upd[`moves/${mv.id}`]=mv});
          fbWrite(upd);render();toast(`تمت تسوية ${list.length} صنف — الأرصدة مضبوطة الحين.`);break}
        case 'rcopen':{const r=rcById(el.dataset.id);if(r){rcOpen(r);render()}break}
        case 'rcclose':{RC_KEYS.forEach(k=>delete F[k]);render();break}
        case 'rcsplit':{F.rmode='split';F.rparts=[];F.rsq=(rcById(F.rid)||{}).name?rcById(F.rid).name+' ':'';render();const s=document.getElementById('rc-s');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}break}
        case 'rchide':{
          const r=rcById(el.dataset.id);if(!r||!CUR_ALL)break;
          const msg=r.status==='confirmed'
            ?`حذف «${r.name}» من سجل التوريدات؟\n\nهذا يشيله من السجل بس — الكمية اللي دخلت المخزون تبقى في الرصيد. لو تبي تخصمها، احذف الفاتورة من نظام المشتريات.`
            :`حذف «${r.name}» من سجل التوريدات؟`;
          if(!confirm(msg))return;
          fbRef.update({[`receipts/${r.id}/hidden`]:true,[`receipts/${r.id}/hiddenBy`]:CUR_EMAIL||'',[`receipts/${r.id}/hiddenAt`]:Date.now()})
            .then(()=>toast('انحذف من السجل.')).catch(()=>toast('تعذّر الحذف — تحقّق من الاتصال.','bad'));
          break}
        case 'rcsame':{F.rmode='same';F.rparts=[];F.rsq='';render();break}
        case 'rcadd':{F.rparts=(F.rparts||[]).concat([{itemId:el.dataset.id,qty:''}]);F.rsq='';render();break}
        case 'rcrm':{F.rparts=(F.rparts||[]).filter((_,k)=>k!==+el.dataset.k);render();break}
        case 'rcnew':rcNewItem();break;
        case 'rcok':rcConfirm();break;
        case 'rcno':rcReject();break;
        case 'additem':{
          const nm=$('#a-name').value.trim();
          const cat=($('#a-cat').value||'').trim()||autoCategory(nm);
          const unit=($('#a-unit').value||'').trim()||'حبة';
          const br=CUR_ALL?($('#a-branch')?$('#a-branch').value:DEFAULT_BRANCH):CUR_BRANCH;
          if(!nm)return toast('اكتب اسم الصنف.','bad');
          if(DB.items.some(i=>sameName(i.name,nm)&&(i.branch||DEFAULT_BRANCH)===br&&!i.archived))return toast('هذا الصنف موجود بالفعل بهذا الفرع.','bad');
          const newItem={id:uid(),name:nm,category:cat,unit,opening:n($('#a-open').value),min:n($('#a-min').value),branch:br};
          DB.items.push(newItem);
          saveItem(newItem);render();toast('تمت إضافة الصنف.');break}
        case 'saveopen':{
          let nameErr=false;
          R.querySelectorAll('[data-name]').forEach(x=>{
            const i=it(x.dataset.name);if(!i)return;
            const v=x.value.trim();
            if(!v){x.value=i.name;return}
            if(sameName(v,i.name))return;
            const br=i.branch||DEFAULT_BRANCH;
            if(DB.items.some(o=>o.id!==i.id&&sameName(o.name,v)&&(o.branch||DEFAULT_BRANCH)===br&&!o.archived)){
              toast(`الاسم «${v}» مستخدم بصنف آخر بنفس الفرع — تم تجاهل هذا التعديل.`,'bad');x.value=i.name;nameErr=true;return;
            }
            i.name=v;saveItemFields(i.id,{name:v});
          });
          R.querySelectorAll('[data-op]').forEach(x=>{const i=it(x.dataset.op);if(i){const v=n(x.value);if(v!==n(i.opening)){
            const after=minBalFrom(i.id,'0000-00-00')-n(i.opening)+v;
            if(after<-1e-9){toast(`«${i.name}»: الافتتاحي ${fmt(v)} أقل من اللي انصرف — يخلّي الرصيد سالب. تم تجاهل هذا التعديل.`,'bad');x.value=n(i.opening);nameErr=true;return}
            i.opening=v;saveItemFields(i.id,{opening:v})}}});
          R.querySelectorAll('[data-mn]').forEach(x=>{const i=it(x.dataset.mn);if(i){const v=n(x.value);if(v!==i.min){i.min=v;saveItemFields(i.id,{min:v})}}});
          R.querySelectorAll('[data-cat]').forEach(x=>{const i=it(x.dataset.cat);if(i){const v=x.value.trim();if(v!==(i.category||'')){i.category=v;saveItemFields(i.id,{category:v})}}});
          R.querySelectorAll('[data-unit]').forEach(x=>{const i=it(x.dataset.unit);if(i&&x.value.trim()){const v=x.value.trim();if(v!==i.unit){i.unit=v;saveItemFields(i.id,{unit:v})}}});
          render();if(!nameErr)toast('تم الحفظ وتحديث الأرصدة.');break}
        case 'delitem':{
          const id=el.dataset.id,i=it(id);
          if(!confirm(`أرشفة الصنف «${i.name}»؟ سجلاته وتقاريره تبقى محفوظة، وتقدر تسترجعه لاحقًا من "عرض الأصناف المؤرشفة".`))return;
          i.archived=true;i.archivedAt=today();i.archivedBy=CUR_EMAIL||'';
          saveItemFields(id,{archived:true,archivedAt:i.archivedAt,archivedBy:i.archivedBy});
          render();toast('تم أرشفة الصنف.');break}
        case 'restoreitem':{
          const id=el.dataset.id,i=it(id);
          if(i){delete i.archived;delete i.archivedAt;delete i.archivedBy;
            saveItemFields(id,{archived:null,archivedAt:null,archivedBy:null});render();toast('تم استرجاع الصنف.');}
          break}
        case 'delitemhard':{
          const id=el.dataset.id,i=it(id);
          if(!confirm(`حذف «${i.name}» نهائيًا؟ هذا الإجراء لا يمكن التراجع عنه.`))return;
          DB.items=DB.items.filter(x=>x.id!==id);
          deleteItemRemote(id);render();toast('تم الحذف نهائيًا.');break}
        case 'togglearch':{F.showArch=!F.showArch;F.q='';F.qcat='';render();break}
        case 'pickitem':{
          const i=it(el.dataset.id);
          if(i){F.mid=i.id;F.mq=i.name;render();}
          break}
        case 'addmove':{
          const type=el.dataset.type, iid=F.mid, q=n(F.mqty);
          if(!iid)return toast('اختر الصنف من نتائج البحث أولاً.','bad');
          if(q<=0)return toast('أدخل كمية أكبر من صفر.','bad');
          if(type==='out'||type==='damage'){
            const d=F.mdate||today();
            const av=minBalFrom(iid,d);   // عملية بتاريخ قديم لازم ما تخلّي الرصيد سالب بأي يوم بعدها
            if(q>av)return toast(`المتاح من «${it(iid).name}» ${d<today()?`بتاريخ ${dH(d)} `:''}هو ${fmt(av)} فقط.`,'bad');
          }
          const newMove={id:uid(),type,date:F.mdate||today(),no:(F.mno||'').trim(),
            party:(F.mparty||'').trim(),itemId:iid,qty:q,notes:(F.mnotes||'').trim(),by:CUR_EMAIL||''};
          DB.moves.push(newMove);
          const i2=it(iid),b=bal(iid),s=st(b,i2.min);
          delete F.mq;delete F.mid;delete F.mdate;delete F.mno;delete F.mparty;delete F.mqty;delete F.mnotes;
          saveMove(newMove);render();
          const msg=type==='in'?`تمت الإضافة. رصيد ${i2.name} الآن ${fmt(b)} ${i2.unit}`
            :type==='out'?`تم الخصم. تبقّى ${fmt(b)} ${i2.unit} من ${i2.name}`
            :`تم تسجيل التالف. تبقّى ${fmt(b)} ${i2.unit} من ${i2.name}`;
          toast(msg);
          if(s.k!=='ok')setTimeout(()=>toast(`${i2.name}: ${s.t}`,'bad'),700);
          break}
        case 'delmove':{
          const mid=el.dataset.id;
          const mvx=DB.moves.find(m=>m.id===mid);
          if(!CUR_ALL)return toast('حذف الحركات من صلاحية الإدارة فقط — تواصل مع رؤوف أو سعود.','bad');
          if(mvx&&mvx.type==='in'&&minBalFrom(mvx.itemId,mvx.date)-n(mvx.qty)<-1e-9)
            return toast(`ما ينفع تحذف هذا الوارد — انصرف منه، وحذفه يخلّي رصيد «${(it(mvx.itemId)||{}).name}» سالب. احذف المنصرف الغلط أول.`,'bad');
          if(!confirm(mvx&&mvx.receiptId?'هذي الحركة جاية من توريد مشتريات مؤكد. حذفها يخصم الكمية من الرصيد لكن التوريد يظل «مستلم» عند المشتريات. متابعة؟':'حذف هذه العملية؟ سيُعاد حساب الرصيد تلقائيًا.'))return;
          DB.moves=DB.moves.filter(m=>m.id!==mid);deleteMoveRemote(mid);render();toast('تم الحذف وتحديث الرصيد.');break}
        case 'toggle':{const k=+el.dataset.k;F.open=F.open===k?null:k;render();break}
        case 'mprev':{F.mpage=Math.max(0,(F.mpage||0)-1);render();break}
        case 'mnext':{F.mpage=(F.mpage||0)+1;render();break}
        case 'pmode':{F.pmode=el.dataset.v;render();break}
        case 'rfull':{F.rfull=!F.rfull;render();break}
        case 'repprint':repPrint();break;
        case 'repexcel':repExcel();break;
        case 'backup':{
          const data=VIEW==='all'?DB:{items:visItems(),moves:visMoves()};
          dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`نسخة_المخزون_${today()}.json`);break}
      }
    };
  });
}
function restore(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items)throw 0;
    DB.items=d.items;DB.moves=d.moves||[];fbReplaceAll();go('open');toast('تم استيراد النسخة.')}
    catch(e){toast('الملف غير صالح.','bad')}};
  r.readAsText(f);
}

/* ---------- الإعدادات (تغيير كلمة المرور) ---------- */
function openSettings(){
  const box=$('#settings-modal');
  box.innerHTML=`
  <div class="modal-bg" id="sm-bg">
    <div class="modal card">
      <div class="card-h"><h3>الإعدادات</h3><button class="btn ghost sm" id="sm-close">إغلاق</button></div>
      <div class="card-b">
        <div class="who">البريد: <b>${esc(CUR_EMAIL||'')}</b><span class="badge-branch">${VIEW==='all'?'كل الفروع':esc(VIEW)}</span></div>
        <h3 style="font-size:13.5px;margin-bottom:10px">تغيير كلمة المرور</h3>
        <div class="grid" style="gap:10px">
          <label class="f"><span>كلمة المرور الحالية</span><input id="sm-cur" type="password" autocomplete="current-password"></label>
          <label class="f"><span>كلمة المرور الجديدة</span><input id="sm-new" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
          <label class="f"><span>تأكيد كلمة المرور الجديدة</span><input id="sm-new2" type="password" autocomplete="new-password"></label>
        </div>
        <div class="btnrow" style="margin-top:14px"><button class="btn primary" id="sm-save">تحديث كلمة المرور</button></div>
        <div class="err" id="sm-err"></div>
      </div>
    </div>
  </div>`;
  $('#sm-close').onclick=()=>box.innerHTML='';
  $('#sm-bg').onclick=e=>{if(e.target.id==='sm-bg')box.innerHTML=''};
  $('#sm-save').onclick=async()=>{
    const cur=$('#sm-cur').value, nw=$('#sm-new').value, nw2=$('#sm-new2').value;
    const err=$('#sm-err');err.textContent='';
    if(!cur||!nw)return err.textContent='عبّي كل الحقول.';
    if(nw.length<6)return err.textContent='كلمة المرور الجديدة لازم تكون 6 أحرف على الأقل.';
    if(nw!==nw2)return err.textContent='كلمتا المرور الجديدتان غير متطابقتين.';
    try{
      const user=firebase.auth().currentUser;
      const cred=firebase.auth.EmailAuthProvider.credential(user.email,cur);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(nw);
      box.innerHTML='';toast('تم تحديث كلمة المرور.');
    }catch(e){err.textContent=authErr(e.code);}
  };
}
function authErr(code){
  return {
    'auth/wrong-password':'كلمة المرور الحالية غير صحيحة.',
    'auth/invalid-credential':'كلمة المرور الحالية غير صحيحة.',
    'auth/user-not-found':'الحساب غير موجود.',
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقًا.',
    'auth/weak-password':'كلمة المرور ضعيفة، اختر كلمة أقوى.',
    'auth/network-request-failed':'تعذّر الاتصال بالإنترنت.'
  }[code] || 'صار خطأ، حاول مرة ثانية.';
}

/* ---------- تسجيل الدخول والخروج ---------- */
let dbHandleBound=false;
function updateStatusText(){
  const s=$('#sync-status');
  if(!s)return;
  const conn=fbRef?'متصل ويُحدَّث لحظيًا':'الحفظ محلي فقط على هذا الجهاز';
  s.textContent=`كميات فقط · ${VIEW==='all'?'كل الفروع':VIEW} · ${conn}`;
}
function paintBranchWidget(){
  const isAll=VIEW==='all';
  const el=$('#branch-select')||$('#branch-badge');
  if(el){el.style.background=isAll?'#E3ECFB':'#E4F1EE';el.style.color=isAll?'#1B4F8C':'#0A5B52';}
}
function buildBranchWidget(){
  const bw=$('#branch-widget');
  if(CUR_ALL){
    bw.innerHTML=`<select id="branch-select" class="badge-branch">
      <option value="all">كل الفروع</option>
      ${BRANCHES.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}
    </select>`;
    $('#branch-select').value=VIEW;
    $('#branch-select').onchange=e=>{VIEW=e.target.value;paintBranchWidget();updateStatusText();F={};render();};
  }else{
    bw.innerHTML=`<span class="badge-branch" id="branch-badge">${esc(CUR_BRANCH)}</span>`;
  }
  paintBranchWidget();
}
async function migrateLegacyIfNeeded(){
  try{
    const snap=await fbRef.once('value');
    const val=snap.val();
    if(val&&Array.isArray(val.items)){
      const itemsKeyed={};(val.items||[]).forEach(i=>{if(i&&i.id)itemsKeyed[i.id]=i});
      const movesKeyed={};(val.moves||[]).forEach(m=>{if(m&&m.id)movesKeyed[m.id]=m});
      await fbRef.set({items:itemsKeyed,moves:movesKeyed});
    }
  }catch(e){/* لو فشل الترحيل، الاشتراك العادي بالأسفل يكمل عادي على البنية القديمة أو الجديدة أيًا كانت */}
}
let itemsFirst=true, movesFirst=true, rcFirst=true;
async function startSync(){
  const s=$('#sync-status');
  if(fbRef){
    updateStatusText();
    await migrateLegacyIfNeeded();
    fbRef.child('items').on('value', snap=>{
      const arr=snap.val()?Object.values(snap.val()):[];
      const changed=JSON.stringify(arr)!==JSON.stringify(DB.items);
      DB.items=arr;
      if(changed)render();
      if(changed&&!itemsFirst)toast('تم تحديث الأصناف — تعديل من مستخدم آخر');
      itemsFirst=false;
    }, ()=>{noStore=true; if(s)s.textContent='تعذّر الاتصال بقاعدة البيانات المشتركة'; toast('تعذّر الاتصال — تحقّق من الإنترنت.','bad')});
    fbRef.child('moves').on('value', snap=>{
      const arr=snap.val()?Object.values(snap.val()):[];
      const changed=JSON.stringify(arr)!==JSON.stringify(DB.moves);
      DB.moves=arr;
      if(changed)render();
      if(changed&&!movesFirst)toast('تم تحديث الحركات — تعديل من مستخدم آخر');
      movesFirst=false;
    }, ()=>{noStore=true});
    fbRef.child('receipts').on('value', snap=>{
      const arr=snap.val()?Object.values(snap.val()):[];
      const before=pendingRc().length;
      const changed=JSON.stringify(arr)!==JSON.stringify(RC);
      RC=arr;
      if(F.rid){const r=rcById(F.rid);if(!r||r.status!=='pending'){RC_KEYS.forEach(k=>delete F[k]);}}
      if(changed)render();
      const after=pendingRc().length;
      if(!rcFirst&&after>before)toast(`وصل توريد جديد من المشتريات (${after} بانتظار التأكيد)`);
      rcFirst=false;
    }, ()=>{});
    fbRef.child('receiptMaps').on('value', snap=>{RMAP=snap.val()||{}}, ()=>{});
  }else{
    try{const raw=localStorage.getItem(KEY);
      if(raw){const d=JSON.parse(raw);DB.items=d.items||[];DB.moves=d.moves||[];render()}}catch(e){}
    noStore=true;
    if(s)s.textContent='تعذّر الاتصال بقاعدة البيانات المشتركة — يتم الحفظ على هذا الجهاز فقط';
    toast('تعذّر تحميل خدمة المزامنة — الحفظ محلي فقط على هذا الجهاز.','bad');
  }
}
$('#lg-btn').onclick=()=>{
  const email=$('#lg-email').value.trim(), pass=$('#lg-pass').value;
  const err=$('#lg-err');err.textContent='';
  if(!email||!pass)return err.textContent='عبّي البريد وكلمة المرور.';
  $('#lg-btn').disabled=true;
  firebase.auth().signInWithEmailAndPassword(email,pass)
    .catch(e=>{err.textContent=authErr(e.code);})
    .finally(()=>{$('#lg-btn').disabled=false});
};
$('#lg-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lg-btn').click()});
$('#btn-logout').onclick=()=>{if(confirm('تسجيل الخروج؟'))firebase.auth().signOut();};
$('#btn-settings').onclick=openSettings;

if(fbRef){
  firebase.auth().onAuthStateChanged(user=>{
    if(user&&PURCHASE_ONLY.includes((user.email||'').toLowerCase())){
      firebase.auth().signOut();
      $('#lg-err').textContent='هذا الحساب مخصص لنظام المشتريات فقط.';
      return;
    }
    if(user){
      if(!access(user.email)){
        firebase.auth().signOut();
        $('#lg-err').textContent='هذا الحساب غير مصرّح له بنظام المخزون — تواصل مع الإدارة.';
        return;
      }
      CUR_EMAIL=user.email; const a=access(CUR_EMAIL); CUR_ALL=a.branch==='all'; CUR_BRANCH=CUR_ALL?null:a.branch;
      VIEW=CUR_ALL?'all':CUR_BRANCH;
      $('#gate').style.display='none'; $('#app').style.display='';
      $('#lg-email').value='';$('#lg-pass').value='';
      buildBranchWidget();
      if(!dbHandleBound){dbHandleBound=true;startSync();}else{render()}
    }else{
      CUR_EMAIL=null;CUR_BRANCH=null;CUR_ALL=false;VIEW=null;
      $('#gate').style.display='';$('#app').style.display='none';
      if(fbRef){try{fbRef.child('items').off();fbRef.child('moves').off();fbRef.child('receipts').off();fbRef.child('receiptMaps').off()}catch(e){}}
      dbHandleBound=false; DB={items:[],moves:[]}; RC=[]; RMAP={}; F={}; itemsFirst=true; movesFirst=true; rcFirst=true;
    }
  });
}else{
  // بدون Firebase (تعذّر تحميل المكتبة) — يتعذّر تسجيل الدخول، لا نعرض التطبيق
  $('#lg-err').textContent='تعذّر تحميل خدمة الدخول — تأكد من الاتصال بالإنترنت.';
}
</script>
